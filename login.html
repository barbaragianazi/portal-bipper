<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIPPER — Entrar</title>
  <link rel="icon" type="image/png" href="shared/assets/logos/fav-icon.png">
  <link rel="stylesheet" href="shared/design-tokens.css">
  <link rel="stylesheet" href="shared/base-components.css">
  <link rel="stylesheet" href="shared/app-shell.css">
  <link rel="stylesheet" href="css/login.css">
  <meta name="description" content="Acesso ao Portal BIPPER." />
</head>

<body class="login-page">
  <div class="login-shell">
    <div class="login-shell__image" style="background-image: url('assets/login-cover.jpg');" role="img"
      aria-label="Imagem de destaque"></div>

    <div class="login-shell__content">
      <div class="login-card">
        <div class="brand login-card__brand" data-brands-url="shared/data/brands.json">
          <div class="brand__area" aria-label="Marca ativa">
            <button class="brand__logo-btn" type="button" aria-label="Selecionar marca" aria-haspopup="true"
              aria-expanded="false">
              <img src="shared/assets/logos/zoetis-light.svg" alt="Zoetis" class="brand__logo login-brand__logo--light"
                data-logo="light">
              <img src="shared/assets/logos/zoetis-dark.svg" alt="Zoetis" class="brand__logo login-brand__logo--dark"
                data-logo="dark">
            </button>
            <div class="brand-dropdown" role="menu" aria-label="Selecionar marca"></div>
          </div>
        </div>



        <div class="login-intro">
          <h1>Acesse a plataforma</h1>
        </div>

        <form class="login-form" id="loginForm">
          <div class="login-field">
            <div class="login-field__control">
              <span class="login-field__leading-icon" aria-hidden="true">
                <svg class="login-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="4" />
                  <path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" />
                </svg>
              </span>
              <input id="loginEmail" name="email" type="email" placeholder="Insira o e-mail cadastrado"
                autocomplete="username" required>
              <button type="button" class="login-field__action" data-clear-target="loginEmail"
                aria-label="Limpar email">
                <svg class="login-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M6 6l12 12M18 6 6 18" />
                </svg>
              </button>
            </div>
          </div>

          <div class="login-field">
            <div class="login-field__label-row">
              <label class="login-field__label eyebrow-label" for="loginPassword"> </label>
              <a href="#" class="login-field__forgot">Esqueceu a senha?</a>
            </div>
            <div class="login-field__control">
              <span class="login-field__leading-icon" aria-hidden="true">
                <svg class="login-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round">
                  <rect x="4" y="11" width="16" height="9" rx="2" />
                  <path d="M8 11V7a4 4 0 0 1 8 0v4" />
                </svg>
              </span>
              <input id="loginPassword" name="password" type="password" placeholder="••••••••"
                autocomplete="current-password" required>
              <button type="button" class="login-field__action" id="togglePassword" aria-label="Mostrar senha"
                aria-pressed="false">
                <svg class="login-field__icon login-field__eye-open" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="login-field__icon login-field__eye-closed" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="m3 3 18 18" />
                  <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                  <path d="M9.1 5.3A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3 4" />
                  <path d="M6.6 6.6C3.6 8.5 2 12 2 12s3.5 7 10 7c1.3 0 2.5-.3 3.5-.8" />
                </svg>
              </button>
            </div>
          </div>

          <p class="login-error" id="loginError" hidden></p>

          <button type="submit" class="btn btn-primary-acent login-submit" style="border-radius: 16px;">Entrar</button>
        </form>

        <div class="login-divider"><span>ou</span></div>

        <div class="login-social">
          <button type="button" class="login-social__btn" data-social="google">
            <svg class="login-social__logo" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335"
                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
              <path fill="#4285F4"
                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
              <path fill="#FBBC05"
                d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
              <path fill="#34A853"
                d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
            </svg>
            <span>Entrar com Google</span>
          </button>
          <button type="button" class="login-social__btn" data-social="microsoft">
            <svg class="login-social__logo" viewBox="0 0 23 23" aria-hidden="true">
              <rect x="1" y="1" width="10" height="10" fill="#F25022" />
              <rect x="12" y="1" width="10" height="10" fill="#7FBA00" />
              <rect x="1" y="12" width="10" height="10" fill="#00A4EF" />
              <rect x="12" y="12" width="10" height="10" fill="#FFB900" />
            </svg>
            <span>Acessar com Microsoft</span>
          </button>
        </div>

        <div class="login-demo">
          <span class="login-demo__title">Login de demonstração</span>
          <div class="login-demo__list">
            <button type="button" class="login-demo__card" data-demo-role="support">
              <span class="login-demo__icon">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path
                    d="M9 4h6a2 2 0 0 1 2 2v2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h3V6a2 2 0 0 1 2-2Zm6 4V6H9v2h6Zm-7 5v2h8v-2H8Z" />
                </svg>
              </span>
              <span class="login-demo__content">
                <strong>Administrador</strong>
                <small>admin@admin.com · admin123</small>
              </span>
            </button>
            <button type="button" class="login-demo__card" data-demo-role="client">
              <span class="login-demo__icon">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="8" r="4" />
                  <path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" />
                </svg>
              </span>
              <span class="login-demo__content">
                <strong>Usuário</strong>
                <small>user@user.com · user123</small>
              </span>
            </button>
          </div>
        </div>
        <!-- 
      Features comentadas para possíveis usos futuros, caso seja necessário habilitar novamente.  -->

        <p class="login-copyright">©<span data-current-year>2026</span> <span data-brand-name>Zoetis</span>. Todos os
          direitos reservados.</p>
      </div>
    </div>
  </div>

  <div class="login-settings-modal" id="loginSettingsModal" hidden>
    <div class="login-settings-modal__backdrop" data-settings-close></div>
    <div class="login-settings-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="loginSettingsTitle">
      <button type="button" class="login-settings-modal__close" data-settings-close aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18" />
        </svg>
      </button>
      <h2 class="login-settings-modal__title" id="loginSettingsTitle">Configurações de exibição</h2>
      <p class="login-settings-modal__desc">Essas opções afetam só esta tela de login, neste navegador.</p>

      <div class="login-settings-modal__list">
        <label class="login-settings-modal__item">
          <span>Botão "Entrar com Google"</span>
          <span class="login-switch">
            <input type="checkbox" data-setting="showGoogle" checked>
            <span class="login-switch__track">
              <span class="login-switch__thumb"></span>
            </span>
          </span>
        </label>
        <label class="login-settings-modal__item">
          <span>Botão "Acessar com Microsoft"</span>
          <span class="login-switch">
            <input type="checkbox" data-setting="showMicrosoft" checked>
            <span class="login-switch__track">
              <span class="login-switch__thumb"></span>
            </span>
          </span>
        </label>
        <label class="login-settings-modal__item">
          <span>Seção "Login de demonstração"</span>
          <span class="login-switch">
            <input type="checkbox" data-setting="showDemo" checked>
            <span class="login-switch__track">
              <span class="login-switch__thumb"></span>
            </span>
          </span>
        </label>
      </div>
    </div>
  </div>

  <script src="shared/app-shell.js"></script>
  <script src="login.js"></script>
</body>

</html>
